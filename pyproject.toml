[project]
name = "splouch"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "pyserial",
    "websocket-client",
    "pillow>=12.3.0",
    # The Pi renders its own QR code so an operator can print one (docs/app.md
    # `P-16`). Pure Python and no system libraries: `qrencode` would be an apt
    # package to add to every install, and `qrcode` renders through Pillow, while
    # segno writes the SVG this page inlines directly. A normal dependency, not an
    # extra — the page is part of the server, and a Pi that cannot draw its own
    # code is a Pi whose operator has no way to put it on a poster.
    "segno>=1.6",
]

# Qt TV display (scoreboard/). Optional so the server Pi and the cloud VM never
# pull Qt: only the kiosk role installs it, via `uv sync --extra scoreboard`.
#
# PySide6, not PyQt5, for three reasons:
#   * PyQt5 publishes no linux aarch64 wheel — not on PyPI, not on piwheels — so
#     `uv sync` cannot resolve it on a 64-bit Raspberry Pi at all.
#   * PySide6 is LGPL; PyQt5 is GPLv3, which sits badly under this project's MIT
#     licence.
#   * Qt 6 supports variable fonts, which three of the bundled faces are.
# Essentials only — QtCore/QtGui/QtWidgets. The Addons package is far larger and
# nothing here needs it.
[project.optional-dependencies]
scoreboard = ["pyside6-essentials>=6.5"]

[dependency-groups]
dev = [
    "diff-cover",
    # The control plane's store (cloud/cloud_db.py); its tests need a Postgres,
    # from TEST_DATABASE_URL, and skip without one.
    "psycopg[binary]",
    "psycopg-pool",
    # The cloud's /metrics (cloud/cloud_metrics.py).
    "prometheus-client",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
# Non-Python linters, pinned by uv.lock like the rest. Opt-in — `uv sync --group
# lint` — and never a default group: three have no Linux aarch64 wheel (Taplo's
# source build is broken outright), and every Pi updates with a plain `uv sync`,
# run by the code it already has. A default group here breaks every Pi's update.
# CI's x86 `lint` job installs this group alone.
lint = [
    "actionlint-py",    # .github/workflows/
    "check-jsonschema", # issue forms, Dependabot and compose, against SchemaStore
    "djlint",           # templates, rules in [tool.djlint] below
    "rumdl",            # Markdown, rules in .markdownlint.json
    "shellcheck-py",
    "shfmt-py",         # settings in .editorconfig
    "taplo",            # TOML, settings in taplo.toml
    "yamllint",         # rules in .yamllint.yml
    "zizmor",           # workflow security, run --offline
]


[tool.pytest.ini_options]
# Every import root, so no test needs `sys.path` surgery of its own. The same
# list as `extra-paths` for ty and `src` for Ruff below.
pythonpath = [".", "server", "shared/py", "cloud"]


# ── Formatting and linting ─────────────────────────────────────────────────────
# `uv run ruff format` owns layout and `I` owns import order, both on Ruff's
# defaults. CI fails on either drifting, so let the editor fix them on save
# rather than doing it by hand.
#
# `src` lists the directories that are import roots, so the isort rules sort
# `state`, `splouch_i18n` and the like as first-party, not third-party.
[tool.ruff]
src = [".", "server", "shared/py", "cloud", "tests"]

# Keep `from x import (a as _a, b as _b)` as one statement, not one line per alias.
[tool.ruff.lint.isort]
combine-as-imports = true

# No per-file-ignores. Every suppression is a `# noqa` on the line it applies
# to, with a reason, so a silenced rule stays visible where it was silenced and
# a file keeps being checked for everything else.
[tool.ruff.lint]
select = [
    "E4",      # imports — placement and form
    "E7",      # statement-level mistakes
    "E9",      # syntax and IO errors
    "F",       # pyflakes: undefined names, unused imports and variables
    "B",       # bugbear: likely-wrong constructs the interpreter still accepts
    "PLE",     # pylint errors — the ones that are always bugs
    "I",       # isort: import order, the same fix organize-imports applies on save
    "RUF100",  # a `# noqa` that no longer suppresses anything
    "ASYNC",   # blocking calls inside `async def` — they stall every connected board
    "UP",      # pyupgrade: the 3.13 spelling of things
    "C4",      # comprehensions: no list() around a generator, no dict() for a literal
    "PIE",     # misc. no-ops: unnecessary pass, reimplemented builtins
    "RET",     # return: no else after return, no explicit `return None`
    "PERF",    # a loop that appends is a comprehension
    "SIM115",  # open() outside a `with` leaks the handle until the GC finds it
    "W",       # whitespace the formatter cannot fix (inside strings, trailing in docstrings)
    "ISC",     # implicit string concatenation — usually a missing comma in a list
    "G",       # logging calls: pass args, don't pre-format the message
    "LOG",     # logging misuse: wrong logger, exception() outside except
    "PGH",     # blanket `# noqa` / `# type: ignore` — every suppression names its rule
    "T10",     # a leftover breakpoint()
    "FLY",     # "".join() of literals is an f-string
    "ERA",     # commented-out code
    "A",       # shadowing a builtin
    "RSE",     # `raise X()` with no arguments is `raise X`
    "PYI",     # typing hygiene: NamedTuple over namedtuple
    "EXE",     # shebang and executable bit agree
    "FURB",    # refurb: the modern spelling (removeprefix, re.DOTALL over re.S)
    "FAST",    # FastAPI: Annotated[...] parameters, the form FastAPI now documents
    "SIM",     # simplifications: contextlib.suppress, merged ifs, dict.get
    "RUF005",  # [*a, b] over a + [b]
    "PLW1510", # subprocess.run() says whether a failure should raise (check=)
    "SLOT",    # __slots__ on str/tuple subclasses
    "TID",     # tidy imports: no relative imports reaching up a package
    "ICN",     # conventional import aliases
    "INT",     # gettext calls with a literal, not a pre-formatted string
    "YTT",     # sys.version comparisons that break at 3.10 or 4.0
    "FA",      # `from __future__ import annotations` where it is needed
]

# ── Templates ──────────────────────────────────────────────────────────────────
# `uv run djlint server/templates cloud/templates shared/templates --lint`. Lint only:
# its formatter rewrites every template and reflows the inline <script> blocks.
# What stays on is what has caught something real — a <button> with no type submits
# its form (the Wi-Fi join form's Cancel used to connect), an <img> without alt, an
# empty src that re-requests the page. What is off is style, or advice for a site
# this is not:
[tool.djlint]
profile = "jinja"
ignore = """\
H021,\
H023,\
H024,\
H029,\
H030,\
J004,\
J018,\
T001,\
T002,\
T032\
"""
# H021 inline styles · H023 entity references · H024 type= on <link> · H029 POST in
# capitals · H030 meta description (no page here is indexed) · J004/J018 url_for():
# routes are written as literal paths throughout · T001/T002/T032 whitespace and
# quotes inside tags, the formatter's job. H049 (zoom disabled) stays on: the
# three pages that need it silence it inline, each saying why.

# ── Type checking ──────────────────────────────────────────────────────────────
# `uv run ty check` is clean, tests included. ty is still pre-1.0 (0.0.x, beta),
# so treat a new diagnostic as a question rather than a verdict — but the answer
# has been worth having every time so far.
#
# Two things to know before annotating anything here:
#
#   * A FastAPI path operation or `Depends()` keeps its `Request` annotation.
#     FastAPI reads those signatures to build the request, and a Protocol in one
#     is taken for a query parameter — the module still imports, and the endpoint
#     breaks. Plain helpers are free to ask for less (see `web.HasHeaders`).
#   * Qt enums are spelled the scoped Qt6 way — `Qt.AlignmentFlag.X`, not the
#     short `Qt.X`. PySide6 resolves both to the same value at runtime, but only
#     the scoped spelling is in its stubs.
[tool.ty.environment]
python-version = "3.13"
extra-paths    = ["server", "shared/py", "cloud"]

# ── Coverage ───────────────────────────────────────────────────────────────────
# Printed in the CI log. Never gated, never uploaded to a third party — the number
# is there to be read, not enforced.
#
# Read it knowing what it cannot tell you. `cts_gen6` sits near 95% and is the one
# console confirmed on hardware; the other four decoders sit near 35% and are the
# ones marked untested in the README. Closing that gap with tests written from the
# same protocol documents the decoders were written from would move the number and
# prove nothing: coverage says a line ran, not that the byte offset is right. Only
# a console on a wire settles that.
#
# Where it does earn its keep is everything that is not about hardware — the cloud
# relay and the authenticated routes are the thin spots worth watching.
[tool.coverage.run]
source = ["server", "scoreboard", "cloud", "shared/py"]
# Branches, not just lines: an `if` with no `else` counts as covered once any test
# runs it, even if none ever takes the other path. Those untaken paths — the
# fallbacks, the console-gone and no-meet cases — are where the bugs have been.
branch = true

[tool.coverage.report]
# Fractional percentages, so a real change is not rounded into invisibility.
precision = 1
