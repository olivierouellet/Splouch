        <div class="tab-pane" id="tab-account">
            <div class="card" style="max-width:360px;"><div class="card-body">
                <h2 class="panel-eyebrow mb-3">{{ t.change_credentials }}</h2>
                {% if creds_error %}<p class="text-danger small mb-3">{{ creds_error }}</p>{% endif %}
                <form method="post" class="d-flex flex-column gap-2">
                    <input type="hidden" name="action" value="change_credentials">
                    <input type="password" name="current_password" class="form-control form-control-sm" placeholder="{{ t.current_password }}" required autocomplete="current-password">
                    <input type="text"     name="new_user"         class="form-control form-control-sm" placeholder="{{ t.new_username }}"    autocomplete="username">
                    <input type="password" name="new_password"     class="form-control form-control-sm" placeholder="{{ t.new_password }}"    required autocomplete="new-password">
                    <input type="password" name="new_password2"    class="form-control form-control-sm" placeholder="{{ t.confirm_password }}" required autocomplete="new-password">
                    <div><button type="submit" class="btn btn-secondary btn-sm">{{ t.save }}</button></div>
                </form>
            </div></div>
        </div>
