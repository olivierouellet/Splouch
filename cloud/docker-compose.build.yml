# Build the image on this box instead of pulling it: a branch deploy, a fork with no
# published image, or a release tag whose CI build has not finished. Added by
# cloud_deploy.py when it needs it; the tag it builds is the one compose would pull,
# so every worker (app2… extend app) runs it.
services:
  control:
    build:
      context: ..          # repo root — gives Dockerfile access to shared/
      dockerfile: cloud/Dockerfile
