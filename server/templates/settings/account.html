        <div class="tab-pane" id="tab-account">
            <div class="row"><div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <form id="account_form" action="/settings" method="POST">
                            <div class="row g-3 mb-1">
                                <div class="col-md-6">
                                    <label for="user_name" class="form-label">{{ t.account_user_name }}</label>
                                    <input name="user_name" id="user_name" value="{{ user_name }}" class="form-control">
                                </div>
                            </div>
                            <hr>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label">{{ t.account_password }}</label>
                                    <input name="password" id="password" type="password" placeholder="{{ t.account_new_password_ph }}"
                                        autocomplete="new-password" class="form-control" oninput="onPasswordInput(this.form);">
                                    <div id="pw-confirm-row" class="mt-2" style="visibility:hidden;">
                                        <input name="password2" type="password" placeholder="{{ t.account_verify_password_ph }}"
                                            autocomplete="new-password" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <button id="btn-update-account" class="btn btn-secondary btn-sm" type="submit">{{ t.btn_update }}</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>
