                <div class="tab-pane" id="tab-logs">
                    <div class="card" style="max-width:1100px;"><div class="card-body">
                        <div class="d-flex gap-2 align-items-center mb-2 flex-wrap">
                            <select id="log-source" class="form-select form-select-sm w-auto" onchange="loadLogs()">
                                <option value="run">{{ t.logs_source_run }}</option>
                                <option value="boot">{{ t.logs_source_boot }}</option>
                                <option value="prev">{{ t.logs_source_prev }}</option>
                            </select>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="loadLogs()">{{ t.btn_refresh }}</button>
                            <div class="form-check m-0">
                                <input class="form-check-input" type="checkbox" id="log-follow" onchange="toggleLogFollow()">
                                <label class="form-check-label" for="log-follow">{{ t.logs_follow }}</label>
                            </div>
                            <span style="position:relative; display:inline-block;">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="toggleLogMenu(event)">{{ t.logs_save }}</button>
                                <div id="log-menu" style="display:none; position:absolute; left:0; top:100%; margin-top:4px; background:var(--bs-tertiary-bg); border:1px solid var(--bs-border-color); border-radius:4px; z-index:50; min-width:150px; box-shadow:0 2px 8px rgba(0,0,0,0.4);">
                                    <button type="button" class="btn btn-secondary btn-sm" style="display:block; width:100%; text-align:left; border:none; border-radius:0;" onclick="downloadLogs()">{{ t.common_download }}</button>
                                    <button type="button" class="btn btn-secondary btn-sm" style="display:block; width:100%; text-align:left; border:none; border-radius:0;" onclick="saveLogsToPi()">{{ t.logs_save_to_pi }}</button>
                                </div>
                            </span>
                            <span id="log-save-status" class="small text-body-secondary"></span>
                            <span id="log-status" class="small text-body-secondary ms-auto"></span>
                        </div>
                        <div class="small text-body-secondary mb-2">{{ t.logs_hint }}</div>
                        <pre id="log-output" class="border rounded p-2 mb-0" style="background:#111; color:#e0e0e0; height:480px; overflow-y:auto; font-size:0.78em; white-space:pre-wrap; word-break:break-all;"></pre>
                    </div></div>
                </div>
