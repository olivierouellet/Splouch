                <div class="tab-pane" id="tab-terminal">
                    <div class="card mb-3" style="max-width:860px;"><div class="card-body">
                        <div class="d-flex align-items-center gap-1 mb-2 flex-wrap">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="termLaunch('bash')">{{ t.term_shell }}</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="termLaunch('raspi-config')">raspi-config</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="termLaunch('dmesg-tty')">dmesg tty</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="termLaunch('serial-ports')">{{ t.term_serial_ports }}</button>
                            <span class="flex-fill"></span>
                            <button type="button" id="btn-term-stop" class="btn btn-danger btn-sm" style="display:none;" onclick="termStop()">{{ t.test_stop }}</button>
                        </div>
                        <div id="terminal-container"></div>
                    </div></div>
                    <!-- Typed into the shell above by Run, so what runs is what is
                         shown, and the same line can be copied into SSH. -->
                    <div class="card" style="max-width:860px;"><div class="card-body">
                        <div class="panel-title">{{ t.term_commands }}</div>
                        {% for key, line in terminal_commands %}
                        <div class="{% if not loop.last %}mb-3{% endif %}">
                            <div class="fw-semibold small">{{ t['term_cmd_' ~ key] }}</div>
                            {% if t.get('term_cmd_' ~ key ~ '_hint') %}<div class="small text-body-secondary mb-1">{{ t['term_cmd_' ~ key ~ '_hint'] }}</div>{% endif %}
                            <div class="d-flex align-items-stretch gap-1">
                                <code class="flex-fill border rounded px-2 py-1 small text-break" style="background:var(--bs-tertiary-bg);">{{ line }}</code>
                                <button type="button" class="btn btn-outline-secondary btn-sm copy" data-copied="{{ t.term_copied }}" data-copy-line="{{ line }}" onclick="copyKey(this, this.dataset.copyLine)">{{ t.term_copy }}</button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="termRun('{{ key }}')">{{ t.term_run }}</button>
                            </div>
                        </div>
                        {% endfor %}
                    </div></div>
                </div>
