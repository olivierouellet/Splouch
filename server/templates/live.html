<!DOCTYPE html>
<html lang="{{ lang | default('en', true) }}">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/timing_display.css') }}">
<style>
:root {
    --color-bg:            {{ theme_colors.bg }};
    --color-header-bg:     {{ theme_colors.header_bg }};
    --color-header-border: {{ theme_colors.header_border }};
    --color-header-label:  {{ theme_colors.header_label }};
    --color-header-value:  {{ theme_colors.header_value }};
    --color-th-text:       {{ theme_colors.th_text }};
    --color-th-bg:         {{ theme_colors.th_bg }};
    --color-row-odd:       {{ theme_colors.row_odd }};
    --color-row-even:      {{ theme_colors.row_even }};
    --color-row-text:      {{ theme_colors.row_text }};
    --color-time:          {{ theme_colors.time }};
    --color-delta-better:  {{ theme_colors.delta_better }};
    --color-delta-worse:   {{ theme_colors.delta_worse }};
    --color-podium-gold:   {{ theme_colors.podium_gold }};
    --color-podium-silver: {{ theme_colors.podium_silver }};
    --color-podium-bronze: {{ theme_colors.podium_bronze }};
    --font-family:         '{{ theme_fonts.family }}';
    --font-digits:         '{{ theme_fonts.digits }}';
    --font-timing:         '{{ theme_fonts.timing }}';
}
</style>
<script>
var labels = {{ labels | tojson }};
var NUM_LANES   = {{ num_lanes }};
/* Lap counts in the delta column while a lane swims (Settings → Display). */
var SHOW_LAPS   = {{ show_laps | default(false) | tojson }};
/* Which way the count runs: 'up' = lengths done, 'down' = lengths left. */
var LAP_DIRECTION    = {{ lap_direction | default('up', true) | tojson }};
var SHOW_PODIUM = {{ show_podium | tojson }};
var lane_running = {};
var lane_place_blank = {};
var lane_time_blank = {};
var lane_name_blank = {};
var last_event = 0;
var last_heat = 0;
var last_state = 0;
var current_state = 0;
var brief_results = false;
var _podium_timers = [];
var _podium_race_key = null;

/* Debounce leaving the results screen: a transient "running" blip at race end
   (a stray finish/place artifact from the console) must not yank the board out
   of results and flicker the podium. Only switch to running if it persists. */
var LEAVE_RESULTS_DEBOUNCE = 350; /* ms */
var _leave_results_timer   = null;

/* Cached stable DOM references — set once in init() */
var _pc = null;  /* place-column */
var _tc = null;  /* time-column  */
var _dc = null;  /* delta-column */
var _sb = null;  /* #scoreboard div      */

/* ── Carousel overlay ─────────────────────────────────────────────────────── */
var CAROUSEL_IMAGES   = {{ carousel_images | tojson }};
var CAROUSEL_INTERVAL = {{ carousel_interval }} * 1000;
var CAROUSEL_FADE     = 1000; /* ms — must match CSS transition */
var _carousel_idx     = 0;
var _carousel_timer   = null;
var _carousel_front   = 'a'; /* which img layer is currently visible */

function _carousel_next() {
    _carousel_idx = (_carousel_idx + 1) % CAROUSEL_IMAGES.length;
    var next_src = '/images/' + CAROUSEL_IMAGES[_carousel_idx];
    var front = document.getElementById('carousel-img-' + _carousel_front);
    var back  = document.getElementById('carousel-img-' + (_carousel_front === 'a' ? 'b' : 'a'));
    back.src     = next_src;
    back.style.opacity  = '1';
    front.style.opacity = '0';
    _carousel_front = (_carousel_front === 'a') ? 'b' : 'a';
}

var _overlay_fade_timer = null;

function show_overlay(active) {
    var ov = document.getElementById('carousel-overlay');
    if (_overlay_fade_timer) { clearTimeout(_overlay_fade_timer); _overlay_fade_timer = null; }

    if (active && CAROUSEL_IMAGES.length) {
        _carousel_idx   = 0;
        _carousel_front = 'a';
        var imgA = document.getElementById('carousel-img-a');
        var imgB = document.getElementById('carousel-img-b');
        imgA.src = '/images/' + CAROUSEL_IMAGES[0];
        imgA.style.opacity = '1';
        imgB.src = '';
        imgB.style.opacity = '0';
        ov.style.display = 'block';
        requestAnimationFrame(function() {
            requestAnimationFrame(function() { ov.style.opacity = '1'; });
        });
        if (!_carousel_timer && CAROUSEL_IMAGES.length > 1)
            _carousel_timer = setInterval(_carousel_next, CAROUSEL_INTERVAL);
    } else {
        ov.style.opacity = '0';
        if (_carousel_timer) { clearInterval(_carousel_timer); _carousel_timer = null; }
        _overlay_fade_timer = setTimeout(function() { ov.style.display = 'none'; }, 850);
    }
}

/* ── Header chrono ────────────────────────────────────────────────────────── */
var _chrono_base  = null;  /* last running_time from server, in hundredths */
var _chrono_at    = null;  /* Date.now() when _chrono_base was recorded     */
var _chrono_timer = null;

function parseHundredths(str) {
    var m = str.match(/^(?:(\d+):)?(\d{1,2})\.(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1] || 0) * 6000 + parseInt(m[2]) * 100 + parseInt(m[3]);
}

function formatHundredths(h) {
    var hh = h % 100;
    var ss = Math.floor(h / 100) % 60;
    var mm = Math.floor(h / 6000);
    var frac = '.' + (hh < 10 ? '0' : '') + hh;
    return mm > 0 ? mm + ':' + (ss < 10 ? '0' : '') + ss + frac : ss + frac;
}

/* The cell stays put either way; only its text comes and goes. Hiding it gave up
   its share of the header bar, so every cell to its left slid across at the end of
   each heat and back again at the start of the next. */
function start_chrono() {
    if (_chrono_timer) return;
    _chrono_timer = setInterval(tick_chrono, 50);
}

function stop_chrono() {
    if (_chrono_timer) { clearInterval(_chrono_timer); _chrono_timer = null; }
    _chrono_base = null;
    document.getElementById('live_chrono').textContent = '';
}

function tick_chrono() {
    if (_chrono_base === null) return;
    var elapsed = Math.floor((Date.now() - _chrono_at) / 10);
    document.getElementById('live_chrono').textContent = formatHundredths(_chrono_base + elapsed);
}

/* Fields the socket handler may write directly to the DOM */
var VALID_FIELDS = new Set([
    "current_event", "current_heat", "event_name",
    {% for i in range(1, num_lanes + 1) %}"lane_place{{ i }}", {% endfor %}
    {% for i in range(1, num_lanes + 1) %}"lane_time{{ i }}", {% endfor %}
    {% for i in range(1, num_lanes + 1) %}"lane_name{{ i }}", {% endfor %}
    {% for i in range(1, num_lanes + 1) %}"lane_club{{ i }}", {% endfor %}
    {% for i in range(1, num_lanes + 1) %}"lane_name_alt{{ i }}", {% endfor %}
]);
/* `lane_delta<i>` is deliberately not in that set: the delta column is shared
   with the lap count, and `renderDelta` owns it. */

/* ── EVENT / HEAT: one size for the pair ──────────────────────────────────────
   `--header-num-size` is a ceiling, not an answer. The kiosk pins these cells to
   10% of the bar each, and `EVENT 12` at the full size does not fit that — nor
   does `ÉPREUVE`, which is what `label_style: long` gives in French. CSS cannot
   shrink text to fit, so the ratio is measured here, exactly as `fitNameFontSize`
   does for a swimmer's name.

   Both cells then take the *smaller* ratio. They sit side by side with a divider
   between them, so a size difference reads as one of them being wrong rather than
   as either being as large as it fits — `BoardWindow._sync_header_cells` hands the
   Qt pair the same shared answer for the same reason. */
function fitHeaderCells() {
    var cells = [document.getElementById('header_event_cell'),
                 document.getElementById('header_heat_cell')].filter(Boolean);
    if (!cells.length) return;
    cells.forEach(function(c) { c.style.removeProperty('--header-num-size'); });
    var ratio = 1;
    cells.forEach(function(cell) {
        /* The cell is `white-space: nowrap`, so scrollWidth is the phrase's natural
           width and clientWidth is what the cell will actually give it. */
        if (cell.scrollWidth > cell.clientWidth && cell.scrollWidth > 0)
            ratio = Math.min(ratio, cell.clientWidth / cell.scrollWidth);
    });
    if (ratio >= 1) return;
    /* Read the ceiling off an element that *uses* the variable, not off the variable
       itself: `getPropertyValue('--header-num-size')` hands back the token `4.5vh`,
       and `parseFloat` of that is 4.5 — so the cell was being set to about four
       pixels the moment the phrase first overflowed. A `font-size` is resolved to
       px by the browser, which is the number this arithmetic needs. */
    var probe = cells[0].querySelector('.header_value');
    var base  = probe && parseFloat(window.getComputedStyle(probe).fontSize);
    if (!base) return;
    var px = (base * ratio * 0.97).toFixed(2) + 'px';
    cells.forEach(function(c) { c.style.setProperty('--header-num-size', px); });
}

function on_timer() {
    var d = new Date();
    var h = ("0" + d.getHours()).slice(-2);
    var m = ("0" + d.getMinutes()).slice(-2);
    document.getElementById("meet_datetime").innerHTML = h + ":" + m;
}

function build_scoreboard_bg() {
    var rows = Array.from(_sb.querySelectorAll('.timing-table tr'));
    var sbRect = _sb.getBoundingClientRect();
    if (!sbRect.height) return;
    var bg = document.getElementById('timing-bg');
    var stops = [];
    rows.forEach(function(row) {
        var rect = row.getBoundingClientRect();
        var color = window.getComputedStyle(row).backgroundColor;
        var top = ((rect.top - sbRect.top) / sbRect.height * 100).toFixed(2) + '%';
        var bot = ((rect.bottom - sbRect.top) / sbRect.height * 100).toFixed(2) + '%';
        stops.push(color + ' ' + top, color + ' ' + bot);
    });
    if (stops.length) bg.style.background = 'linear-gradient(to bottom, ' + stops.join(', ') + ')';
}

function apply_state_transition() {
    if (current_state === last_state) return;
    switch (current_state) {
        case 1:
            mode_to_intro();
            break;
        case 2:
            mode_to_running();
            break;
        case 3:
            mode_to_results();
            if (brief_results) {
                setTimeout(function() {
                    if (current_state == 3) {
                        last_state = 3;
                        current_state = 1;
                        mode_to_intro();
                        last_state = current_state;
                    }
                }, 3000);
            }
            break;
    }
    last_state = current_state;
}

/* Scale a name down until it fits its cell rather than cutting it, per row. This
   is what the Qt board has always done via FitLabel (scoreboard/board.py); this
   page used to be the one display that clipped instead — see
   notes/scoreboard_parity.md. Reads laid-out widths, so callers run it after paint
   and only when a name changed. */
function fitNameFontSize() {
    document.querySelectorAll('.lane-name-cell').forEach(function(cell) {
        cell.style.fontSize = '';
        var primary = cell.querySelector('.name-primary');
        if (!primary || primary.scrollWidth <= primary.clientWidth) return;
        var ratio  = primary.clientWidth / primary.scrollWidth;
        var basePx = parseFloat(window.getComputedStyle(cell).fontSize);
        cell.style.fontSize = (basePx * ratio * 0.97).toFixed(2) + 'px';
    });
}

/* The cached column references, bound as soon as the table has been parsed.

   Deliberately not part of `init()`: that runs on `load`, which waits for every
   image and font, while the socket opens the moment the script at the foot of the
   body runs. The server answers a new connection with a burst — `test_mode`,
   `columns_state`, the heat's names and then the board cache — and every one of
   those handlers reaches a `mode_to_*` or `*_cols` that writes `_pc.style`. Losing
   that race threw `null` out of the message handler on a cold load, before any of
   these were assigned.

   Idempotent, and called from both places: the foot of the body for the socket,
   and `init()` so nothing depends on which of the two happens to run first. */
function bind_dom() {
    _pc = document.getElementById("place-column");
    _tc = document.getElementById("time-column");
    _dc = document.getElementById("delta-column");
    _sb = document.getElementById("scoreboard");
}

function init() {
    bind_dom();
    on_timer();
    window.setInterval(on_timer, 1000);
    setTimeout(build_scoreboard_bg, 100);
    window.addEventListener('resize', function() {
        build_scoreboard_bg();
        requestAnimationFrame(fitNameFontSize);
        requestAnimationFrame(fitHeaderCells);
    });
    requestAnimationFrame(fitHeaderCells);   /* the labels are server-rendered */
}

function highlight_podium() {
    if (!SHOW_PODIUM) return;
    _podium_timers.forEach(function(t) { clearTimeout(t); });
    _podium_timers = [];
    var by_place = {};
    document.querySelectorAll('[id^="lane_place"]').forEach(function(el) {
        var place = parseInt(el.textContent.trim());
        if (place >= 1 && place <= 3) by_place[place] = el.parentElement;
    });
    var delays = {1: 0, 2: 400, 3: 800};
    [1, 2, 3].forEach(function(place) {
        var row = by_place[place];
        if (!row) return;
        var cls = place === 1 ? 'podium-gold' : place === 2 ? 'podium-silver' : 'podium-bronze';
        if (row.classList.contains(cls)) return;
        row.classList.remove('podium-gold', 'podium-silver', 'podium-bronze');
        _podium_timers.push(setTimeout(function() { row.classList.add(cls); }, delays[place]));
    });
}

function clear_podium() {
    _podium_timers.forEach(function(t) { clearTimeout(t); });
    _podium_timers = [];
    document.querySelectorAll('.podium-gold, .podium-silver, .podium-bronze').forEach(function(el) {
        el.classList.remove('podium-gold', 'podium-silver', 'podium-bronze');
    });
}

function reset_times() {
    document.querySelectorAll('[id^="lane_time"]').forEach(function(el) {
        el.classList.remove('time-running', 'time-locked');
    });
}

/* ── Delta cell: lap count, then the time difference ──────────────────────────
   The kiosk's copy of the phone board's renderer (scoreboard_base.html) — this
   page predates the shared base and keeps its own frame handler. Keep the two in
   step; `notes/scoreboard_parity.md` records the behaviour they owe each other.

   One cell, two tenants. While a lane is swimming it carries the lengths that lane
   has completed, in the row's own colour — the colour the swimmer's name is in, so
   it reads as progress rather than as a result. At the finish the delta arrives and
   takes the cell back in its better/worse colour. The column header never moves.

   Rendered from remembered state rather than written straight from the frame,
   because the two tenants arrive in *different* frames: the console sends the place
   on the touch and the server sends the delta a frame or two later. */
var lane_splits_n   = {};
var lane_delta_html = {};
var expected_splits = 0;
var split_step      = 1;

/* No lap once the lane has a place: that is the finish, whatever the delta is
   doing. A swimmer with no seed time never gets a delta at all, so waiting for one
   would leave the lap sitting under a finished swim for the rest of the heat. */
function lapVisible(i) {
    if (!SHOW_LAPS) return false;
    if (!((lane_delta_html[i] || '').trim() === '')) return false;
    if ((i in lane_place_blank) && !lane_place_blank[i]) return false;
    if (lane_splits_n[i] > 0) return true;
    /* Nothing swum yet, and here the two directions part company. Counting up has
       nothing to say — a column of noughts under a start list is noise. Counting
       down has the whole race to report, so it shows from the moment the heat
       loads rather than waiting for the first wall. It needs a swimmer in the lane
       to say it about: an empty lane in a short heat must not advertise eight
       lengths nobody is swimming. */
    return countingDown() && (i in lane_name_blank) && !lane_name_blank[i];
}

/* Counting down needs a total to count down from. `expected_splits` is 0 for any
   event whose meet file carries no distance, and the count falls back to up. */
function countingDown() {
    return LAP_DIRECTION === 'down' && expected_splits > 0;
}

/* What the cell shows for lane `i`. Counting down is `expected - done`, clamped at
   0 so a console that over-counts (a stray touch on an inferred count) shows the
   last length rather than a negative one. With no expected total there is nothing
   to count down from, so it counts up instead — silently, because the operator
   picked the direction once and the board is not the place to argue about a
   missing meet file. */
function lapText(i) {
    /* `|| 0`: before the first touch a lane has no `lane_splits<i>` at all, and
       `expected - undefined` is NaN. Unreachable while the count needed a split to
       show; the countdown's start-of-heat number is exactly that case. */
    var done = lane_splits_n[i] || 0;
    if (countingDown()) return String(Math.max(0, expected_splits - done));
    return String(done);
}

/* On the final stretch — the number stays, the colour moves to the timing gold.
   Necessarily true until the finish once it fires: `+ split_step` is what the
   console reports next, and that is the finish, so no later split can take it
   back. With touchpads at one end only it covers the last *two* lengths, because
   the swimmer is not seen in between (docs/api.md §5.1). */
function lapIsFinal(i) {
    return expected_splits > 0 &&
           (lane_splits_n[i] + split_step) >= expected_splits;
}


function renderDelta(i) {
    var el = document.getElementById('lane_delta' + i);
    if (!el) return;
    var delta = lane_delta_html[i] || '';
    if (delta.trim() !== '') {
        el.innerHTML = delta;
        el.classList.remove('lap-count', 'lap-final');
        return;
    }
    if (lapVisible(i)) {
        el.textContent = lapText(i);
        el.classList.add('lap-count');
        el.classList.toggle('lap-final', lapIsFinal(i));
        return;
    }
    el.textContent = '';
    el.classList.remove('lap-count', 'lap-final');
}

/* Fill or blank the EVENT / HEAT / event-name group. An idle board shows just the
   two clocks — the meet title used to sit here instead, but it is on the splash on
   both displays now, and this page never called `set_header_mode(false)` anyway, so
   the cell only ever appeared on a cold board before the first heat. */
function set_header_mode(active) {
    document.getElementById("header_event_cell").style.display      = active ? ""     : "none";
    document.getElementById("header_heat_cell").style.display       = active ? ""     : "none";
    document.getElementById("header_name_cell").style.display       = active ? ""     : "none";
}

function expand_cols() {
    _pc.style.width = '6vw';  _pc.style.maxWidth = '6vw';
    _tc.style.width = '17vw'; _tc.style.maxWidth = '17vw';
    _dc.style.width = '15vw'; _dc.style.maxWidth = '15vw';
    _tc.innerHTML = labels.time;
}

function collapse_cols() {
    _pc.classList.remove("timing-anim"); _tc.classList.remove("timing-anim"); _dc.classList.remove("timing-anim");
    _pc.style.width = '0'; _pc.style.maxWidth = '0';
    _tc.style.width = '0'; _tc.style.maxWidth = '0';
    _dc.style.width = '0'; _dc.style.maxWidth = '0';
    _tc.innerHTML = '';
    void _pc.offsetWidth;
    _pc.classList.add("timing-anim"); _tc.classList.add("timing-anim"); _dc.classList.add("timing-anim");
}

function reset_state() {
    current_state = 0;
    last_state = 0;
    last_event = 0;
    last_heat = 0;
    lane_running = {};
    lane_place_blank = {};
    lane_time_blank = {};
    lane_name_blank = {};
    lane_splits_n = {};
    lane_delta_html = {};
    expected_splits = 0;
    split_step = 1;
    for (var i = 1; i <= NUM_LANES; i++) renderDelta(i);
    if (_leave_results_timer) { clearTimeout(_leave_results_timer); _leave_results_timer = null; }
}

function mode_to_intro() {
    brief_results = false;
    stop_chrono();
    set_header_mode(true);
    clear_podium();
    reset_times();
    _pc.classList.remove("timing-anim"); _tc.classList.remove("timing-anim"); _dc.classList.remove("timing-anim");
    _pc.style.width = '0'; _pc.style.maxWidth = '0';
    _tc.style.width = '0'; _tc.style.maxWidth = '0';
    _dc.style.width = '0'; _dc.style.maxWidth = '0';
    _tc.innerHTML = '';
    void _pc.offsetWidth;
    _pc.classList.add("timing-anim"); _tc.classList.add("timing-anim"); _dc.classList.add("timing-anim");
}

function mode_to_running() {
    brief_results = false;
    set_header_mode(true);
    clear_podium();
    _podium_race_key = last_event + '|' + last_heat;
    expand_cols();
}

function mode_to_results() {
    stop_chrono();
    set_header_mode(true);
    expand_cols();
    highlight_podium();
}

</script>
</head>

<body style="margin:0px" onload="init();">

<div id="carousel-overlay" style="display:none; position:fixed; inset:0; z-index:1000; background:#000; opacity:0; transition:opacity 0.8s ease;">
    <img id="carousel-img-a" src="" style="position:absolute; inset:4%; width:92%; height:92%; object-fit:contain; transition:opacity 1s ease; opacity:1;">
    <img id="carousel-img-b" src="" style="position:absolute; inset:4%; width:92%; height:92%; object-fit:contain; transition:opacity 1s ease; opacity:0;">
</div>

<div class="timing-outer">

    <!-- Header bar. `header_cells_fixed` gives the cells fixed shares of the width
         instead of sizing them to their content, so nothing shifts when the event
         number gains a digit or the race clock blanks between heats — see
         notes/scoreboard_parity.md. -->
    <div class="timing-header-bar header_cells_fixed">
        <div class="header_cell" id="header_event_cell" style="display:none;">
            <span class="header_label">{{ labels.event }}</span>
            <span class="header_value" id="current_event"></span>
        </div>
        <div class="header_cell" id="header_heat_cell" style="display:none;">
            <span class="header_label">{{ labels.heat }}</span>
            <span class="header_value" id="current_heat"></span>
        </div>
        <div class="header_cell header_cell_name" id="header_name_cell" style="display:none;">
            <span class="header_value" id="event_name"></span>
        </div>
        <!-- The chrono cell is always present, even with nothing to show: removing
             it would give up its share of the bar and slide every cell to its left
             across on each heat end. -->
        <div class="header_cell" id="header_chrono_cell">
            <span id="live_chrono" style="color:var(--color-time);font-family:var(--font-digits),monospace;font-size:4.5vh;"></span>
        </div>
        <div class="header_cell" id="header_clock_cell">
            <span id="meet_datetime" style="font-family:var(--font-digits),monospace;font-size:4.5vh;color:var(--color-header-label);"></span>
        </div>
    </div>

    <!-- Scoreboard table -->
    <div class="timing-content" id="scoreboard">
        <div id="timing-bg" aria-hidden="true"></div>
        <table id="timing-board" class="timing-table{% if not show_lane_header %} hide-lane-header{% endif %}{% if not show_name_header %} hide-name-header{% endif %}{% if not show_club_header %} hide-club-header{% endif %}{% if not show_time_header %} hide-time-header{% endif %}{% if not show_delta_header or show_laps %} hide-delta-header{% endif %}{% if not show_position_header %} hide-position-header{% endif %}{% if not show_name %} hide-name{% endif %}{% if not show_club %} hide-club{% endif %}{% if not show_delta %} hide-delta{% endif %}{% if not show_position %} hide-position{% endif %}">
            <thead>
                <tr class="timing-header">
                    <th class="lane-column" style="text-align:center;">{{ labels.lane }}</th>
                    <th id="name-column" style="text-align:left;">{{ labels.name }}</th>
                    <th class="club-column" style="text-align:left;">{{ labels.club }}</th>
                    <th id="time-column" class="time-column timing-anim" style="text-align:center;">{{ labels.time }}</th>
                    <th id="delta-column" class="delta-column timing-anim" style="text-align:center;">{{ labels.delta }}</th>
                    <th id="place-column" class="place-column timing-anim" style="text-align:center;">{{ labels.place }}</th>
                </tr>
            </thead>
            <tbody>
                {% for i in range(1, num_lanes + 1) %}
                <tr class="{{ 'timing-row-odd' if i % 2 == 1 else 'timing-row-even' }}">
                    <td style="text-align:center;">{{ i }}</td>
                    <td class="lane-name-cell"><span id="lane_name{{ i }}" class="name-primary"></span><span id="lane_name_alt{{ i }}" class="name-sub"></span></td>
                    <td id="lane_club{{ i }}" style="text-align:left;"></td>
                    <td class="td_time" style="text-align:center;"><span id="lane_time{{ i }}"></span></td>
                    <td class="td_delta" id="lane_delta{{ i }}"></td>
                    <td id="lane_place{{ i }}" style="text-align:center;"></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    {% if test_background %}
    <div class="controls">
        <button type="button" onclick="mode_to_intro();">Intro</button>
        <button type="button" onclick="mode_to_running();">Running</button>
        <button type="button" onclick="mode_to_results();">Results</button>
        <br/>
        <button type="button" onclick="socket.emit('next_heat', {});">Next Heat</button>
    </div>
    {% endif %}

</div>
<div id="test-overlay" class="test-overlay" style="display:none;">⚠ TEST SESSION</div>

<div class="background"></div>

<script src="/static/js/ws.js"></script>
<script>
    var s = {};

    /* Before the socket, never after: the connect burst starts arriving as soon as
       it opens and every frame in it writes to these. See `bind_dom`. */
    bind_dom();

    var socket = splouchSocket('/ws/scoreboard');
    socket.on('connect', function() { reset_state(); stop_chrono(); });
    socket.on('reload', function() { location.reload(); });
    /* The server says this board is stale — a test session just ended and the
       real meet is back. Same pair as `connect` and `test_mode` use. */
    socket.on('reset', function() { reset_state(); mode_to_intro(); });
    socket.on('display_overlay', function(d) { show_overlay(d.active); });
    socket.on('columns_state', function(d) { if (d.hidden) collapse_cols(); else expand_cols(); });
    socket.on('race_finished', function() {
        if ((last_event + '|' + last_heat) === _podium_race_key) highlight_podium();
    });
    socket.on('test_mode', function(d) {
        document.getElementById('test-overlay').style.display = d.active ? '' : 'none';
        if (d.active) { reset_state(); mode_to_intro(); }
    });

    socket.on('update_scoreboard', function(new_s) {
        for (var k in new_s) { s[k] = new_s[k]; }

        /* Both halves of the lap test are board-wide and arrive with the heat, so
           they are read before any lane is rendered below. */
        if ("expected_splits" in s) expected_splits = s["expected_splits"] || 0;
        if ("split_step" in s)      split_step      = s["split_step"] || 1;

        var names_changed = false;
        var delta_lanes   = {};
        for (var k in s) {
            if (VALID_FIELDS.has(k)) {
                document.getElementById(k).innerHTML = s[k];
            }
            if (k.startsWith("lane_splits")) {
                var si = k.replace("lane_splits", "");
                lane_splits_n[si] = parseInt(s[k], 10) || 0;
                delta_lanes[si] = true;
            }
            if (k.startsWith("lane_delta") && !k.startsWith("lane_delta_")) {
                var di = k.replace("lane_delta", "");
                lane_delta_html[di] = s[k] || '';
                delta_lanes[di] = true;
            }
            if (k.startsWith("lane_running")) {
                var li = k.replace("lane_running", "");
                var was_running = lane_running[li] || false;
                lane_running[li] = s[k];
                var tel = document.getElementById("lane_time" + li);
                if (tel) {
                    if (s[k]) {
                        tel.classList.add('time-running');
                        tel.classList.remove('time-locked');
                    } else if (was_running) {
                        tel.classList.remove('time-running');
                        tel.classList.remove('time-locked');
                        void tel.offsetWidth;
                        tel.classList.add('time-locked');
                    }
                }
            }
            if (k.startsWith("lane_time"))  lane_time_blank[k.replace("lane_time", "")]  = (s[k].trim() === "");
            if (k.startsWith("lane_place")) {
                var pi = k.replace("lane_place", "");
                lane_place_blank[pi] = (s[k].trim() === "");
                delta_lanes[pi] = true;          /* a place ends the lap */
            }
            if (k.startsWith("lane_name")) names_changed = true;
            if (k.startsWith("lane_name") && !k.startsWith("lane_name_alt"))
                lane_name_blank[k.replace("lane_name", "")] = (s[k].trim() === "");
        }
        /* A heat's `expected_splits` lands in the same frame as its blanked lanes,
           but a `split_step` that changed on its own (the operator switching the
           touchpad setting mid-meet) touches no lane at all — so repaint every lane
           when either moves, and only the lanes that changed otherwise. */
        if ("expected_splits" in s || "split_step" in s) {
            for (var li2 = 1; li2 <= NUM_LANES; li2++) renderDelta(li2);
        } else {
            for (var di2 in delta_lanes) renderDelta(di2);
        }
        /* Only when a name actually arrived — a heat change, not every tick. This
           page also carries the running clock, so it sees far more frames than the
           phone board does; re-fitting on each one would cost a layout per lane. */
        if (names_changed) requestAnimationFrame(fitNameFontSize);
        /* The header phrase changes with the heat, not with every tick. */
        if ("current_event" in s || "current_heat" in s)
            requestAnimationFrame(fitHeaderCells);

        if ("running_time" in s) {
            var any_running = false;
            for (var i = 1; i <= NUM_LANES; i++) {
                if ((lane_running[i] || false) || (lane_place_blank[i] && !lane_time_blank[i])) { any_running = true; break; }
            }
            if (any_running) {
                var h = parseHundredths(s["running_time"]);
                if (h !== null) { _chrono_base = h; _chrono_at = Date.now(); }
                if (current_state === 2) start_chrono();
                for (var i = 1; i <= NUM_LANES; i++) {
                    if (lane_running[i] || false)
                        document.getElementById("lane_time" + i).innerHTML = s["running_time"];
                }
            }
        }

        if ("current_event" in s && s["current_event"] != last_event) {
            last_event = s["current_event"];
            current_state = 1;
        }
        if ("current_heat" in s && s["current_heat"] != last_heat) {
            last_heat = s["current_heat"];
            current_state = 1;
        }

        if (current_state != 1) {
            var all_done = true;
            for (var i = 1; i <= NUM_LANES; i++) {
                if (((i in lane_running) && lane_running[i]) ||
                    ((i in lane_place_blank) && lane_place_blank[i] &&
                     (i in lane_time_blank)  && !lane_time_blank[i])) {
                    all_done = false;
                    break;
                }
            }
            if (all_done) current_state = 3;
        }

        var running_now = false;
        for (var i = 1; i <= NUM_LANES; i++) {
            if (lane_running[i] || false) { running_now = true; break; }
        }
        if (running_now) current_state = 2;

        if (current_state === 1 && last_state === 2) {
            brief_results = true;
            current_state = 3;
        }

        // Hold the results screen against a brief running blip: only leave
        // results for running once it has persisted for LEAVE_RESULTS_DEBOUNCE.
        if (last_state === 3 && current_state === 2) {
            current_state = 3;  // stay on results for now
            if (_leave_results_timer === null) {
                _leave_results_timer = setTimeout(function() {
                    _leave_results_timer = null;
                    var still = false;
                    for (var j = 1; j <= NUM_LANES; j++) {
                        if (lane_running[j] || false) { still = true; break; }
                    }
                    if (still && last_state === 3) {
                        current_state = 2;
                        apply_state_transition();
                    }
                }, LEAVE_RESULTS_DEBOUNCE);
            }
        } else if (_leave_results_timer !== null && !running_now) {
            clearTimeout(_leave_results_timer);
            _leave_results_timer = null;
        }

        apply_state_transition();
        s = {};
    });

</script>
</body>
</html>
