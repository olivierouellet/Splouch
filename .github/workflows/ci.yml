# Runs the suite on the platform Splouch actually ships to, not the one it is
# written on: Debian Trixie on aarch64, with Debian's own python3.13. That is
# Raspberry Pi OS Trixie minus the firmware — there is no official Raspberry Pi OS
# container, and the unofficial ones are single-maintainer repos not worth trusting
# with a build.
#
# Two things this catches that a Mac cannot: ext4 is case-sensitive where APFS is
# not, so a mis-cased template path fails here and nowhere else; and aarch64 is
# where the PySide6-over-PyQt5 decision in pyproject.toml has to hold.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# CI reads the code and nothing else: no job pushes, comments or publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Debian Trixie · aarch64
    # Free for public repositories, and the Pi's architecture. On a private repo
    # this bills — swap to `ubuntu-latest` there and accept x86_64.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 20
    # The control plane's store (cloud/cloud_db.py). Its tests skip without a
    # database, so the guard step below fails the run if this one is missing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: splouch
          POSTGRES_PASSWORD: splouch
          POSTGRES_DB: splouch_test
        options: >-
          --health-cmd "pg_isready -U splouch -d splouch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://splouch:splouch@postgres:5432/splouch_test
      # Debian's python3.13 is what the Pi runs. Without these uv would download a
      # standalone build instead and quietly test a different interpreter than the
      # one on the pool deck.
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON_PREFERENCE: only-system
      # The install step decides what is in the environment; `uv run` must not
      # re-sync it behind that step's back.
      UV_NO_SYNC: "1"
    steps:
      - name: Install system packages
        # Qt needs these even headless: the offscreen platform plugin still links
        # libQt6Gui, which pulls EGL/GL, fontconfig and dbus. conftest.py already
        # sets QT_QPA_PLATFORM=offscreen, so nothing else is needed here.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            python3 python3-venv nodejs \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxkbcommon0 libx11-6

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # scoreboard/version.py runs `git describe --tags`. It degrades to a bare
          # SHA without them (--always), but the tags make the version it reports
          # mean something.
          fetch-depth: 0

      - name: Mark the checkout safe for git
        # The container runs as root over a directory owned by the runner user, which
        # git refuses to touch until it is declared safe.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Every action is pinned to a commit, with its tag in the comment: a tag can
      # be moved to other code, a commit cannot (zizmor checks). Dependabot bumps
      # the SHA and the comment together.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen: uv.lock decides, nothing resolves fresh. It also pins ruff and a
        # pre-1.0 ty, so neither can turn this red overnight by releasing.
        # Default groups, as a Pi's own update resolves them (install.sh and the
        # update routes run a plain `uv sync`): a default group that cannot install
        # on aarch64 fails here, not on the pool deck. The lint group is opt-in for
        # that reason — three of its tools have no aarch64 wheel.
        run: uv sync --extra scoreboard --frozen

      - name: Check Qt is really here
        # The guard that makes green mean green. Every Qt test module skips at module
        # level when PySide6 is missing, and pytest reports that as one skipped line
        # per module rather than the couple of hundred tests inside — a suite that never
        # touched the kiosk still looks passing. Fail loudly here instead.
        run: uv run python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Check the JavaScript engine is really here
        # The same guard as Qt, for the same reason. tests/jsc.py runs each page's
        # scripts for real; on macOS that is JavaScriptCore via osascript, which does
        # not exist here, so Debian resolves to node. Without either, 48 tests skip
        # and the run still reports green — including every page-load smoke test.
        run: node --version

      - name: Check Postgres is really here
        # The same guard again: without a database the control plane's tests skip
        # and the run still reports green.
        run: uv run python -c "import os, psycopg; psycopg.connect(os.environ['TEST_DATABASE_URL']).close(); print('postgres ok')"

      - name: Format
        # Check only: CI never rewrites. `uv run ruff format` locally, or save in
        # VS Code, fixes whatever this reports.
        run: uv run ruff format --check --diff

      - name: Lint
        # Includes the `I` rules, so unsorted imports fail here.
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Tests
        # --cov prints the table into this log and stops there: nothing is uploaded,
        # nothing is gated. pyproject.toml says what the number is and is not good
        # for. `term-missing` instead of `term` locally, for the line numbers. The
        # XML is for diff-cover below.
        run: uv run pytest tests/ -q --cov --cov-report=term --cov-report=xml

      - name: Coverage of the changed lines
        # Which of this pull request's lines no test ran — the question the overall
        # number cannot answer. Printed, never gated, like the table above. Pull
        # requests only: a push to master has no base to compare against. The
        # base branch is already here (fetch-depth: 0).
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch "origin/$BASE_REF"

  lint:
    name: Everything but Python
    # Nothing here depends on the Pi's platform, so it runs apart from the Qt suite and
    # reports in seconds rather than after it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `uv run` would otherwise sync the whole project — FastAPI, and Qt with the
      # extra — to run linters that need none of it.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the linters
        # Every one but Biome is in the lint group, so uv.lock pins them like Ruff and
        # ty. Biome and TypeScript are npm-only; package-lock.json pins them the same way.
        run: |
          uv sync --only-group lint --frozen
          npm ci --no-fund --no-audit

      - name: ShellCheck
        # -S warning: install.sh provisions both Pis
        run: uv run shellcheck -S warning install.sh install/*.sh install/scripts/*.sh

      - name: shfmt
        # Check only. Its settings are in .editorconfig; `uv run shfmt -w install.sh install/` fixes.
        run: uv run shfmt -d install.sh install/

      - name: Workflows
        # Expressions, runner labels, and ShellCheck over every `run:` block.
        run: uv run actionlint

      - name: Workflow security
        # Token permissions, persisted credentials, unpinned actions, template
        # injection. --offline: the audits that need the GitHub API are skipped, so
        # the result depends on this file alone.
        run: uv run zizmor --offline .github/workflows/

      - name: YAML
        run: uv run yamllint --strict .

      - name: YAML schemas
        # What the Red Hat extension checks in the editor, for the files actionlint
        # does not cover. The schemas ship inside check-jsonschema, so this is
        # offline. A broken issue form does not render on GitHub, and a broken
        # dependabot.yml stops the updates, both silently. Every template but
        # config.yml is an issue form, including ones added later.
        run: |
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name config.yml \
            -exec uv run check-jsonschema --builtin-schema vendor.github-issue-forms {} +
          uv run check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
          uv run check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
          uv run check-jsonschema --builtin-schema vendor.compose-spec cloud/docker-compose.yml

      - name: Markdown
        # Rules in .markdownlint.json, which the VS Code extension reads too.
        run: uv run rumdl check .

      - name: JavaScript and CSS
        # Lint and format check in one; rules in biome.jsonc. `npx biome check --write` fixes.
        run: npx biome ci

      - name: JavaScript types
        # `// @ts-check` in each script; settings and page globals in shared/static/js.
        run: npx tsc -p shared/static/js/jsconfig.json

      - name: Templates
        # Lint only, rules in [tool.djlint] in pyproject.toml.
        run: uv run djlint server/templates cloud/templates shared/templates --lint

      - name: TOML
        # Format check, then syntax, and pyproject.toml against its published schema.
        # Settings in taplo.toml; `uv run taplo fmt` fixes.
        run: |
          uv run taplo fmt --check
          uv run taplo lint

      - name: Lockfile in step with pyproject.toml
        # Every install here is --frozen, which trusts uv.lock as it stands: a
        # dependency edited in pyproject.toml without `uv lock` would go unnoticed.
        # (npm ci already refuses a package-lock.json out of step with package.json.)
        run: uv lock --check

      - name: Cloud requirements
        # cloud/requirements.txt is generated from requirements.in and hash-pinned.
        # Re-running the command in its header keeps every existing pin (no
        # --upgrade), so the file changes only if the two have drifted apart.
        run: |
          uv pip compile cloud/requirements.in --universal --python-version 3.13 \
            --generate-hashes -o cloud/requirements.txt --quiet
          git diff --exit-code cloud/requirements.txt
