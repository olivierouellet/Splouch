# Runs the suite on the platform Splouch actually ships to, not the one it is
# written on: Debian Trixie on aarch64, with Debian's own python3.13. That is
# Raspberry Pi OS Trixie minus the firmware — there is no official Raspberry Pi OS
# container, and the unofficial ones are single-maintainer repos not worth trusting
# with a build.
#
# Two things this catches that a Mac cannot: ext4 is case-sensitive where APFS is
# not, so a mis-cased template path fails here and nowhere else; and aarch64 is
# where the PySide6-over-PyQt5 decision in pyproject.toml has to hold.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Debian Trixie · aarch64
    # Free for public repositories, and the Pi's architecture. On a private repo
    # this bills — swap to `ubuntu-latest` there and accept x86_64.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 20
    env:
      # Debian's python3.13 is what the Pi runs. Without these uv would download a
      # standalone build instead and quietly test a different interpreter than the
      # one on the pool deck.
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - name: Install system packages
        # Qt needs these even headless: the offscreen platform plugin still links
        # libQt6Gui, which pulls EGL/GL, fontconfig and dbus. conftest.py already
        # sets QT_QPA_PLATFORM=offscreen, so nothing else is needed here.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            python3 python3-venv nodejs \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libfreetype6 libxkbcommon0 libx11-6

      - uses: actions/checkout@v7
        with:
          # scoreboard/version.py runs `git describe --tags`. It degrades to a bare
          # SHA without them (--always), but the tags make the version it reports
          # mean something.
          fetch-depth: 0

      - name: Mark the checkout safe for git
        # The container runs as root over a directory owned by the runner user, which
        # git refuses to touch until it is declared safe.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Exact version, not a major tag: setup-uv stopped publishing floating
      # majors after v7, so `@v10` does not resolve. Dependabot bumps this.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # --frozen: uv.lock decides, nothing resolves fresh. It also pins ruff and a
        # pre-1.0 ty, so neither can turn this red overnight by releasing.
        run: uv sync --extra scoreboard --frozen

      - name: Check Qt is really here
        # The guard that makes green mean green. Every Qt test module skips at module
        # level when PySide6 is missing, and pytest reports that as one skipped line
        # per module rather than the couple of hundred tests inside — a suite that never
        # touched the kiosk still looks passing. Fail loudly here instead.
        run: uv run python -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: Check the JavaScript engine is really here
        # The same guard as Qt, for the same reason. tests/jsc.py runs each page's
        # scripts for real; on macOS that is JavaScriptCore via osascript, which does
        # not exist here, so Debian resolves to node. Without either, 48 tests skip
        # and the run still reports green — including every page-load smoke test.
        run: node --version

      - name: Format
        # Check only: CI never rewrites. `uv run ruff format` locally, or save in
        # VS Code, fixes whatever this reports.
        run: uv run ruff format --check --diff

      - name: Lint
        # Includes the `I` rules, so unsorted imports fail here.
        run: uv run ruff check

      - name: Type check
        run: uv run ty check

      - name: Tests
        # --cov prints the table into this log and stops there: nothing is uploaded,
        # nothing is gated. pyproject.toml says what the number is and is not good
        # for. `term-missing` instead of `term` locally, for the line numbers.
        run: uv run pytest tests/ -q --cov --cov-report=term

  lint:
    name: Shell, YAML and Markdown
    # Nothing here depends on the Pi's platform, so it runs apart from the Qt suite and
    # reports in seconds rather than after it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `uv run` would otherwise sync the whole project — FastAPI, and Qt with the
      # extra — to run five linters that need none of it.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the linters
        # Every one is a wheel in the dev group, so uv.lock pins them like Ruff and ty.
        run: uv sync --only-group dev --frozen

      - name: ShellCheck
        # -S warning: install.sh provisions both Pis
        run: uv run shellcheck -S warning install.sh install/*.sh install/scripts/*.sh

      - name: shfmt
        # Check only. Its settings are in .editorconfig; `uv run shfmt -w install.sh install/` fixes.
        run: uv run shfmt -d install.sh install/

      - name: Workflows
        # Expressions, runner labels, and ShellCheck over every `run:` block.
        run: uv run actionlint

      - name: YAML
        run: uv run yamllint --strict .

      - name: Markdown
        # Rules in .markdownlint.json, which the VS Code extension reads too.
        run: uv run rumdl check .
