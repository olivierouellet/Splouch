[privacy]
title         = "Politique de confidentialité"
updated_label = "Dernière mise à jour"
intro         = "Splouch présente les compétitions de natation en direct : le tableau d'affichage, les résultats et la liste de départ. Cette politique s'applique à ce site ({host}) et aux applications Splouch pour Android et iOS. En bref : vous ne donnez jamais à Splouch votre nom, une adresse courriel ni un compte. La seule chose qui puisse être liée à une visite est un identifiant aléatoire conservé sur votre appareil pour le comptage de l'assistance, décrit plus bas."
who_h         = "Qui exploite quoi"
who           = "Splouch est un logiciel libre. Ce site est exploité par son administrateur. Le serveur Splouch propre à une piscine est exploité par l'organisateur de la compétition. Un serveur que vous ajoutez vous-même à l'application est exploité par quelqu'un d'autre, et ce sont ses pratiques qui s'y appliquent."
who_operator  = "Ce site est exploité par {operator}, qui décide de la façon dont les renseignements décrits ici sont traités et en répond."
count_h       = "Comptage de l'assistance"
count_1       = "Pour estimer combien de personnes suivent une compétition, l'administrateur de ce site peut activer le comptage de l'assistance. Il est désactivé tant qu'il ne l'active pas, et pendant qu'il est actif, la liste des compétitions l'indique."
count_2       = "La première fois que vous ouvrez une compétition sur un serveur, votre navigateur ou l'application crée un identifiant aléatoire et le conserve sur votre appareil. Il n'est tiré ni de votre appareil, ni d'un compte, ni de quoi que ce soit qui vous concerne, et chaque serveur en reçoit un différent. Il est transmis quand vous ouvrez le tableau d'affichage, les résultats ou la liste de départ d'une compétition."
count_3       = "Pendant que le comptage est actif, le serveur qui porte la compétition enregistre cet identifiant, la compétition, laquelle des trois pages a été ouverte et l'heure — rien d'autre : ni votre adresse IP, ni votre position, ni votre nom, ni votre appareil. Ce serveur se trouve dans la région où l'organisateur de la compétition est établi (Canada, États-Unis ou Europe), et l'identifiant y reste : il ne sert qu'à compter les visiteurs distincts par compétition, et seuls ces totaux en sortent — l'administrateur n'en voit jamais rien d'autre. Pendant que le comptage est désactivé, l'identifiant est ignoré sans être enregistré."
count_4       = "Le comptage est fait par les serveurs de ce site seulement. Le serveur Splouch d'une piscine ne reçoit jamais l'identifiant ; il peut en voir les totaux. Les enregistrements sont supprimés après {days} jours. Ils ne sont jamais vendus ni partagés, et ne servent jamais à identifier, localiser ou profiler qui que ce soit."
count_basis   = "Le comptage repose sur l'intérêt légitime de l'administrateur à savoir combien de personnes suivent une compétition, afin de s'y préparer. L'identifiant est traité comme un renseignement personnel, même s'il ne dit rien de vous."
app_h         = "Les applications Splouch"
app_1         = "Les applications Android et iOS communiquent uniquement avec les serveurs que vous choisissez : ce site par défaut, un serveur ajouté par son adresse ou en balayant un code QR, ou le serveur d'une piscine trouvé sur votre réseau local. Elles ne contiennent aucun service de publicité, d'analyse ni de rapport de plantage, et ne demandent aucune autorisation autre que l'accès au réseau — sur iOS, cela inclut le réseau local, pour trouver le serveur d'une piscine."
app_2         = "Vos réglages — les serveurs ajoutés et celui en usage, votre langue, le style d'affichage et l'apparence, le dernier onglet consulté — sont conservés sur votre appareil, avec l'identifiant d'assistance de chaque serveur et une copie de ses textes. Désinstaller l'application les supprime."
web_h         = "Ce site"
web_1         = "Vos choix d'affichage (langue, style des libellés et apparence) sont conservés dans des témoins sur votre appareil pendant au plus un an. Votre identifiant d'assistance, sa date de création et votre choix de permettre ou non le comptage sont conservés dans le stockage local de votre navigateur ; l'identifiant est remplacé après 13 mois. Rien de cela ne sert à vous suivre."
web_2         = "Ce site ne conserve aucun journal des requêtes : les pages que vous ouvrez et votre adresse IP ne sont pas enregistrées."
web_3         = "Ce site ne vous suit pas sur d'autres sites, et aucun autre site ne vous suit ici par son entremise ; le signal « Ne pas me pister » d'un navigateur n'y change donc rien. Le signal Global Privacy Control est respecté : un navigateur qui l'envoie commence avec le comptage de l'assistance désactivé."
meets_h       = "Résultats des compétitions"
meets         = "Les tableaux d'affichage, résultats et listes de départ montrent le nom, le club et les temps des athlètes tels que publiés par l'organisateur de la compétition. Ces renseignements viennent de l'organisateur, pas de vous ; les questions à leur sujet s'adressent à lui. Ils ne sont conservés que sur le serveur qui porte la compétition, dans la région où son organisateur est établi (Canada, États-Unis ou Europe). Une fois le serveur de la compétition déconnecté, la compétition est supprimée de ce site à minuit après sa dernière journée. Pour ces renseignements, ce site agit pour le compte de l'organisateur."
choices_h     = "Vos droits"
choices       = "Vous pouvez demander l'accès aux renseignements personnels que ce site détient à votre sujet, leur rectification ou leur suppression, et vous opposer à leur utilisation. Sur ce site, Réglages › Confidentialité désactive le comptage et supprime l'identifiant. Un enregistrement d'assistance ne contient qu'un identifiant aléatoire : nous ne pouvons retrouver le vôtre que si vous nous le fournissez. Pour repartir avec un nouvel identifiant, effacez les données de ce site dans votre navigateur, ou celles de l'application sur votre téléphone. Au Québec, vous pouvez aussi porter plainte auprès de la Commission d'accès à l'information ; en Europe, auprès de votre autorité de protection des données."
changes_h     = "Modifications"
changes       = "Quand cette politique change, la date en haut de la page change aussi."
contact_h     = "Contact"
contact       = "Les questions sur cette politique et les demandes au sujet de vos renseignements s'adressent à la personne responsable de la protection des renseignements personnels :"
