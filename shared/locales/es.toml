[privacy]
title         = "Política de privacidad"
updated_label = "Última actualización"
intro         = "Splouch muestra competiciones de natación en directo: el marcador, los resultados y la lista de salida. Esta política se aplica a este sitio ({host}) y a las aplicaciones Splouch para Android e iOS. En resumen: nunca le da a Splouch su nombre, un correo electrónico ni una cuenta. Lo único que puede vincularse a una visita es un identificador aleatorio guardado en su dispositivo para contar la asistencia, descrito más abajo."
who_h         = "Quién opera qué"
who           = "Splouch es software libre. Este sitio lo opera su administrador. El servidor Splouch propio de una piscina lo opera quien organiza la competición. Un servidor que usted mismo añade a la aplicación lo opera otra persona, y se aplican sus prácticas."
who_operator  = "Este sitio lo gestiona {operator}, que decide cómo se trata la información descrita aquí y responde de ello."
count_h       = "Conteo de asistencia"
count_1       = "Para estimar cuántas personas siguen una competición, el administrador de este sitio puede activar el conteo de asistencia. Está desactivado salvo que lo active, y mientras está activo, Ajustes › Privacidad lo indica, junto al interruptor que lo desactiva para usted (en las aplicaciones, la introducción también lo muestra)."
count_2       = "La primera vez que abre una competición en un servidor, su navegador o la aplicación genera un identificador aleatorio y lo guarda en su dispositivo. No se deriva de su dispositivo, de una cuenta ni de nada sobre usted, y cada servidor recibe uno distinto. Se envía al abrir el marcador, los resultados o la lista de salida de una competición."
count_3       = "Mientras el conteo está activo, el servidor que lleva la competición guarda ese identificador, la competición, cuál de las tres páginas se abrió y la hora; nada más: ni su dirección IP, ni su ubicación, ni su nombre, ni su dispositivo. Ese servidor está en la región donde se encuentra el organizador de la competición (Canadá, Estados Unidos o Europa), y el identificador se queda allí: solo sirve para contar visitantes distintos por competición, y solo esos totales salen de allí, que es todo lo que ve el administrador. Mientras el conteo está desactivado, el identificador se descarta sin guardarse."
count_4       = "El conteo lo hacen únicamente los servidores de este sitio. El servidor Splouch de una piscina nunca recibe el identificador; puede ver los totales. Los registros se eliminan después de {days} días. Nunca se venden ni se comparten, y nunca se usan para identificar, localizar ni perfilar a nadie."
count_basis   = "El recuento se basa en el interés legítimo del operador en saber cuántas personas siguen una competición, para prepararse. El identificador se trata como información personal, aunque no diga nada de usted."
app_h         = "Las aplicaciones Splouch"
app_1         = "Las aplicaciones para Android e iOS se comunican solo con los servidores que usted elige: este sitio por defecto, uno que añada por su dirección o escaneando un código QR, o el servidor de una piscina encontrado en su red local. No contienen servicios de publicidad, analítica ni informes de errores, y no piden más permisos que el acceso a la red (en iOS y en las versiones recientes de Android, eso incluye la red local, para encontrar y alcanzar el servidor de una piscina) y, cuando sigue a un nadador, las notificaciones."
app_2         = "Sus ajustes — los servidores añadidos y el que está en uso, su idioma, estilo de visualización y apariencia, la última pestaña vista — se guardan en su dispositivo, junto con el identificador de asistencia de cada servidor y una copia de sus textos. Desinstalar la aplicación los elimina."
notify_h      = "Notificaciones de serie"
notify_1      = "En las aplicaciones puede seguir a nadadores en una competición y recibir un aviso cuando su serie se acerca y cuando está en la consola de cronometraje. Solo cuando lo activa, la aplicación pide a su teléfono permiso para mostrar notificaciones y envía al servidor que lleva la competición un token de notificación (una dirección aleatoria que Apple o Google asignan para que una notificación llegue a su teléfono), el idioma de la aplicación y los nombres y clubes que sigue allí; nunca nada más sobre usted. En Android, el token viene de Firebase Cloud Messaging de Google, a través de los servicios de Google Play; en iOS, de Apple."
notify_2      = "Ese servidor los guarda solo para enviar estas notificaciones, en la región del organizador de la competición, y pasa el token y el texto de la notificación a Apple o Google para entregarla. Se eliminan cuando la competición se elimina de este sitio (a medianoche después de su último día), cuando deja de seguir, o cuando Apple o Google indican que el token ya no es válido. Una competición trasladada a otro servidor de este sitio se los lleva. Desactivar las notificaciones en la aplicación, o para la aplicación en los ajustes del teléfono, las detiene; desinstalar la aplicación invalida el token."
web_h         = "Este sitio"
web_1         = "Sus opciones de visualización (idioma, estilo de etiquetas y apariencia) se guardan en cookies en su dispositivo durante un año como máximo. Su identificador de asistencia, la fecha en que se creó y si permite el recuento se guardan en el almacenamiento local de su navegador; el identificador se sustituye a los 13 meses. Nada de ello se usa para seguirle."
web_2         = "Este sitio no conserva registros de solicitudes: no se registran las páginas que abre ni su dirección IP."
web_3         = "Este sitio no le sigue a otros sitios, y ningún otro sitio le sigue aquí a través de él, así que la señal «No rastrear» de un navegador no cambia nada en él. Se respeta Global Privacy Control: un navegador que la envía empieza con el recuento de asistencia desactivado."
meets_h       = "Resultados de las competiciones"
meets         = "Los marcadores, resultados y listas de salida muestran el nombre, el club y los tiempos de los atletas tal como los publica el organizador de la competición. Esa información procede del organizador, no de usted; las preguntas al respecto deben dirigirse a él. Se guardan solo en el servidor que lleva la competición, en la región donde se encuentra su organizador (Canadá, Estados Unidos o Europa). Una vez desconectado el servidor de la competición, esta se elimina de este sitio a la medianoche siguiente a su último día. Para esa información, este sitio actúa en nombre del organizador."
choices_h     = "Sus derechos"
choices       = "Puede solicitar el acceso, la rectificación o la supresión de la información personal que este sitio tenga sobre usted, y oponerse a su uso. En este sitio, Ajustes › Privacidad desactiva el recuento y borra el identificador. Un registro de asistencia solo contiene un identificador aleatorio, así que solo podemos encontrar el suyo si nos lo facilita. Para empezar de nuevo con otro, borre los datos de este sitio en su navegador, o los de la aplicación en su teléfono. En Europa, también puede reclamar ante su autoridad de protección de datos; en Quebec, ante la Commission d'accès à l'information."
changes_h     = "Cambios"
changes       = "Cuando esta política cambie, la fecha de arriba cambiará con ella."
contact_h     = "Contacto"
contact       = "Las preguntas sobre esta política y las solicitudes sobre su información se dirigen a la persona responsable de la protección de la información personal:"

