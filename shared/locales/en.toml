# The privacy policy (`GET /privacy`, cloud only). Its own section, not `[mobile]`:
# nothing here is in `GET /i18n/{lang}`, so no app fetches or renders it. Every
# sentence is a claim about what the code does — change the code, change this.
# `{host}` and `{days}` are filled in by the page.
[privacy]
title         = "Privacy policy"
updated_label = "Last updated"
intro         = "Splouch shows swimming meets live: the scoreboard, the results and the start list. This policy covers this website ({host}) and the Splouch apps for Android and iOS. In short: you never give Splouch your name, an email address or an account. The one thing that can be tied to a visit is a random identifier kept on your device for attendance counting, described below."
who_h         = "Who runs what"
who           = "Splouch is open-source software. This website is run by its operator. A pool's own Splouch server is run by whoever runs the meet. A server you add to the app yourself is run by someone else, and its operator's practices apply to it."
who_operator  = "This website is run by {operator}, which decides how the information described here is handled and answers for it."
count_h       = "Attendance counting"
count_1       = "To estimate how many people follow a meet, the operator of this website can turn on attendance counting. It is off unless they turn it on, and while it is on, Settings › Privacy says so, beside the switch that turns it off for you (in the apps, the introduction shows it too)."
count_2       = "The first time you open a meet on a server, your browser or the app makes up a random identifier and keeps it on your device. It is not derived from your device, your account or anything about you, and each server gets a different one. It is sent along when you open a meet's scoreboard, results or start list."
count_3       = "While counting is on, the server carrying the meet stores that identifier, the meet, which of the three pages was opened, and the time — nothing else: not your IP address, your location, your name or your device. That server is in the region where the meet's organizer is based (Canada, the United States or Europe), and the identifier stays there: it is used for one thing, counting distinct visitors per meet, and only those totals are sent on, which is all the operator ever sees. While counting is off, the identifier is discarded without being stored."
count_4       = "Counting is done by this website's servers alone. A pool's own Splouch server never receives the identifier; it may be shown the totals. Stored records are deleted after {days} days. They are never sold or shared, and never used to identify, locate or profile anyone."
count_basis   = "Counting rests on the operator's legitimate interest in knowing how many people follow a meet, to plan for them. The identifier is treated as personal information, even though it says nothing about you."
app_h         = "The Splouch apps"
app_1         = "The Android and iOS apps talk only to the servers you choose: this website by default, one you add by its address or by scanning a QR code, or a pool's server found on your local network. They contain no advertising, analytics or crash-reporting services, and ask for no permission beyond network access — on iOS and on recent Android versions, that includes the local network, to find and reach a pool's server — and, once you follow a swimmer, notifications."
app_2         = "Your settings — the servers you added and the one in use, your language, display style and appearance, the last tab you viewed — are stored on your device, along with each server's attendance identifier and a copy of its text. Uninstalling the app deletes them."
notify_h      = "Heat notifications"
notify_1      = "In the apps you can follow swimmers at a meet and be told when their heat is coming up and when it is on the timing console. Only when you turn this on does the app ask your phone for permission to show notifications, and send the server carrying the meet a push token (a random address Apple or Google issues so a notification reaches your phone), the app's language, and the names and clubs you follow there — never anything else about you. On Android the token comes from Google's Firebase Cloud Messaging, through Google Play services; on iOS, from Apple."
notify_2      = "That server keeps them only to send these notifications, in the region where the meet's organizer is based, and passes the token and the notification's text to Apple or Google to deliver it. They are deleted when the meet is deleted from this website (midnight after its last day), when you stop following, or when Apple or Google report the token is no longer valid. A meet moved to another of this website's servers takes them with it. Turning notifications off in the app, or for the app in your phone's settings, stops them; uninstalling the app makes the token invalid."
web_h         = "This website"
web_1         = "Your display choices (language, label style and appearance) are kept in cookies on your device for up to a year. Your attendance identifier, the date it was made, and whether you allow counting are kept in your browser's local storage; the identifier is replaced after 13 months. None of these is used to follow you."
web_2         = "This website keeps no request logs: the pages you open and your IP address are not recorded."
web_3         = "This website does not follow you onto other sites, and no other site follows you here through it, so a browser's Do Not Track signal changes nothing on it. Global Privacy Control is honoured: a browser that sends it starts with attendance counting off."
meets_h       = "Meet results"
meets         = "Scoreboards, results and start lists show athletes' names, clubs and times as published by the meet's organizer. That information comes from the organizer, not from you; questions about it go to them. They are kept only on the server that carries the meet, in the region where its organizer is based (Canada, the United States or Europe). Once the meet's own server has disconnected, the meet is deleted from this website at midnight after its last day. For that information, this website acts on the organizer's behalf."
choices_h     = "Your rights"
choices       = "You can ask for access to, correction or deletion of personal information this website holds about you, and object to its use. On this website, Settings › Privacy turns counting off and deletes the identifier. An attendance record holds only a random identifier, so we can find yours only if you give us that identifier. To start over with a new one, clear this site's data in your browser, or the app's storage on your phone. In Europe, you may also complain to your data protection authority; in Quebec, to the Commission d'accès à l'information."
changes_h     = "Changes"
changes       = "When this policy changes, the date at the top changes with it."
contact_h     = "Contact"
contact       = "Questions about this policy, and requests about your information, go to the person in charge of protecting personal information:"

