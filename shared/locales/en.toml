analytics_legal_ca         = "Generally permitted. No consent pop-up is required for anonymous, first-party audience counting, but PIPEDA and Quebec Law 25 require that you inform visitors (the app shows a short privacy note) and that you do not use the id to identify, locate, or profile anyone. Keep it aggregate only."
