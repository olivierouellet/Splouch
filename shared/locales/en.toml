analytics_legal_us         = "Generally permitted with a privacy notice. State laws (e.g. California CCPA/CPRA) focus on selling or sharing personal data, which this feature does not do. Disclosing it in a privacy notice is the safe practice."
analytics_legal_eu_h       = "Europe (EU / UK)"
analytics_legal_eu         = "Stricter. Storing an id on a visitor's device normally requires consent under the ePrivacy Directive, unless it qualifies for the audience-measurement exemption that some regulators (e.g. France's CNIL, UK ICO) allow for anonymous first-party analytics. If you have EU/UK visitors, confirm you meet those conditions or add a consent banner before enabling."
