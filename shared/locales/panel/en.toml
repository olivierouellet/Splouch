# Race detection, in the Timing pane. These two are console behaviour, not
# display behaviour: one gates when results are published, the other how long a
# lane must stay stopped to count a length.
timing_tuning                  = "Race detection"
timing_finish_debounce         = "Finish confirmation delay"
timing_finish_debounce_help    = "How long the server waits, after the console reports every lane finished, before publishing the results. The snapshot is taken at once; if the console leaves the finished state inside this window — a stray artifact at race end — nothing is sent. Raising it makes a false finish less likely to reach a screen; lowering it puts the final times and podium colours up sooner. It gates the results for the scoreboard, the Results page and the cloud alike, so every screen waits this long."
timing_finish_debounce_warn    = "Not the default. Every screen shows the results this long after the console reports the finish."
timing_restore_default         = "Restore default"
timing_split_min               = "Minimum split stop"
timing_split_min_help          = "How long a lane’s clock must stay stopped before it counts as a completed length. Shorter counts a turn sooner but risks counting a momentary console blip; longer ignores blips at the cost of missing a very quick touch. With touchpads at one end only, each counted stop advances the length count by two."
timing_split_min_warn          = "Not the default. A length is counted only once the clock has been stopped this long."

