timing_finish_debounce_help = "Espera tras la llegada de todas las calles, antes de publicar. Instantánea tomada al momento; se anula si la consola sale del estado terminado en este lapso. Más largo = menos llegadas falsas; más corto = resultados antes. Vale para todas las pantallas."
timing_split_min            = "Parada mínima para una longitud"
timing_split_min_help       = "Tiempo que el crono de una calle debe estar parado para contar un largo. Más corto: virajes antes, riesgo de falsos. Más largo: ignora falsos, puede perder un toque rápido. Placas en un extremo: cada parada = 2 largos."

