# Race detection, in the Timing pane. These two are console behaviour, not
# display behaviour: one gates when results are published, the other how long a
# lane must stay stopped to count a length.
timing_tuning                  = "Detección de carrera"
timing_finish_debounce         = "Retardo de confirmación de llegada"
timing_finish_debounce_help    = "Cuánto espera el servidor, tras informar la consola de que todas las calles han llegado, antes de publicar los resultados. La instantánea se toma de inmediato; si la consola sale del estado de llegada dentro de esa ventana — un artefacto pasajero al final de la carrera — no se envía nada. Subirlo reduce el riesgo de que una llegada falsa alcance una pantalla; bajarlo muestra antes los tiempos finales y los colores del podio. Afecta por igual al marcador, a la página de Resultados y a la nube, así que todas las pantallas esperan lo mismo."
timing_finish_debounce_warn    = "Distinto del valor por defecto. Los resultados aparecen en todas las pantallas tras ese retardo."
timing_restore_default         = "Restaurar el valor por defecto"
timing_split_min               = "Parada mínima para una longitud"
timing_split_min_help          = "Cuánto debe permanecer parado el cronómetro de una calle para contar una longitud. Más corto cuenta el viraje antes pero puede contar un parpadeo momentáneo de la consola; más largo ignora esos parpadeos a costa de perder un toque muy rápido. Con placas en un solo extremo, cada parada contada avanza el contador en dos."
timing_split_min_warn          = "Distinto del valor por defecto. Una longitud solo se cuenta tras una parada de esa duración."

