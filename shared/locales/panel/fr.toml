# Race detection, in the Timing pane. These two are console behaviour, not
# display behaviour: one gates when results are published, the other how long a
# lane must stay stopped to count a length.
timing_tuning                  = "Détection de course"
timing_finish_debounce         = "Délai de confirmation de l’arrivée"
timing_finish_debounce_help    = "Temps d’attente du serveur, après que la console signale toutes les lignes arrivées, avant de publier les résultats. L’instantané est pris immédiatement; si la console quitte l’état « arrivé » pendant ce délai — un artefact passager en fin de course — rien n’est envoyé. Augmenter réduit le risque qu’une fausse arrivée atteigne un écran; diminuer affiche plus tôt les temps finaux et les couleurs du podium. Ce délai s’applique au tableau, à la page Résultats et au nuage, donc tous les écrans attendent d’autant."
timing_finish_debounce_warn    = "Différent de la valeur par défaut. Les résultats apparaissent sur tous les écrans après ce délai."
timing_restore_default         = "Rétablir la valeur par défaut"
timing_split_min               = "Arrêt minimal pour une longueur"
timing_split_min_help          = "Durée pendant laquelle le chronomètre d’une ligne doit rester arrêté pour compter une longueur. Plus court, le virage est compté plus tôt mais un bref artefact de la console risque de l’être aussi; plus long, les artefacts sont ignorés au risque de manquer une touche très rapide. Avec des plaques d’un seul côté, chaque arrêt compté avance le compteur de deux."
timing_split_min_warn          = "Différent de la valeur par défaut. Une longueur n’est comptée qu’après un arrêt de cette durée."

